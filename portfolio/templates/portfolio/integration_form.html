{% extends 'portfolio/base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-10 max-w-2xl">
    <div class="mb-8">
        <a href="{% url 'integration_list' %}" class="text-sm font-bold text-gray-500 hover:text-black transition-colors flex items-center gap-2 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Zpět na seznam integrací
        </a>
        <h1 class="text-4xl font-black italic uppercase tracking-tighter text-black">
            {{ title|default:"Správa integrace" }}
        </h1>
        <div class="h-2 w-20 bg-[#ffee00] mt-2"></div>
    </div>

    <div class="bg-white p-8 md:p-10 rounded-[2.5rem] shadow-2xl border border-gray-100">
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 gap-6">
                {% for field in form %}
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-1">
                        {{ field.label }}
                    </label>
                    <div class="relative">
                        {{ field }}
                    </div>
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1 font-bold">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}
            </div>

            <div class="pt-6 flex flex-col md:flex-row gap-4">
                <button type="submit" class="bg-black text-[#ffee00] px-8 py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-gray-800 transition-all shadow-lg flex-1">
                    Uložit integraci
                </button>
                <a href="{% url 'integration_list' %}" class="bg-gray-100 text-gray-500 px-8 py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-gray-200 transition-all text-center">
                    Zrušit
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    input, select, textarea {
        width: 100% !important;
        padding: 1rem !important;
        background-color: #f9fafb !important;
        border: 2px solid #f3f4f6 !important;
        border-radius: 1rem !important;
        font-size: 0.875rem !important;
        font-weight: 600 !important;
        transition: all 0.2s !important;
        outline: none !important;
    }
    input:focus, select:focus {
        border-color: #ffee00 !important;
        background-color: white !important;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05) !important;
    }
</style>
{% endblock %}
